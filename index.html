<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8" />
<title>Chat Tolis</title>
<link rel="icon" type="image/png" href="favicon.ico" />
<style>
body{
  font-family:sans-serif;
  display:flex;
  flex-direction:column;
  height:100vh;
  margin:0;
  background-color: #121212; /* dark background */
  color: #e0e0e0; /* light text */
}
#chatTitle{
  background-color: #1f1f1f;
  color: #ffffff;
  padding:1rem;
  text-align:center;
}
#titleInput,#titleBtn{
  margin:0.5rem;
  padding:.5rem;
  background-color:#2c2c2c;
  color:#e0e0e0;
  border:1px solid #444;
  border-radius:5px;
}
#groupSelect{
  margin:0.5rem;
  padding:.5rem;
  background-color:#2c2c2c;
  color:#e0e0e0;
  border:1px solid #444;
  border-radius:5px;
}
#messages{
  flex:1;
  overflow:auto;
  padding:1rem;
  background-color:#181818;
}
form{
  display:flex;
  padding:1rem;
  gap:.5rem;
  background-color:#1f1f1f;
}
input,button,select{
  padding:.5rem;
  background-color:#2c2c2c;
  color:#e0e0e0;
  border:1px solid #444;
  border-radius:5px;
}
.msg{
  margin-bottom:.5rem;
  border-radius:5px;
  padding:.3rem;
  background-color:#333; /* πιο ανοιχτό background για να φαίνονται τα μηνύματα */
  color: #fff; /* default text color */
}
#onlineUsers{
  padding:.5rem;
  text-align:center;
  background:#1f1f1f;
  font-size:0.9rem;
}
</style>
</head>
<body>

<h1 id="chatTitle">Το Chat του Tolis</h1>

<div style="text-align:center">
  <input id="titleInput" placeholder="Γράψε τίτλο..." />
  <button id="titleBtn">Αλλαγή Τίτλου</button>
</div>

<div style="text-align:center">
  <label>Group:</label>
  <select id="groupSelect">
    <option value="general">General</option>
    <option value="gaming">Gaming</option>
    <option value="random">Random</option>
  </select>
</div>

<div id="onlineUsers">Online: </div>

<div id="messages"></div>

<form id="sendForm">
  <input id="name" placeholder="Όνομα" required />
  <input id="text" placeholder="Μήνυμα" required />
  <button>Στάλτο</button>
</form>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, onValue, set, onDisconnect } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCZDZ5kwRQPkOJVyL5QaZsnNjP7fZjegao",
  authDomain: "my-chat-tolis.firebaseapp.com",
  databaseURL: "https://my-chat-tolis-default-rtdb.firebaseio.com",
  projectId: "my-chat-tolis",
  storageBucket: "my-chat-tolis.appspot.com",
  messagingSenderId: "1041074379087",
  appId: "1:1041074379087:web:140f77c0c8f1240e3d4d3a"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const messagesEl = document.getElementById('messages');
const sendForm = document.getElementById('sendForm');
const nameInp = document.getElementById('name');
const textInp = document.getElementById('text');
const titleEl = document.getElementById('chatTitle');
const titleInput = document.getElementById('titleInput');
const titleBtn = document.getElementById('titleBtn');
const onlineEl = document.getElementById('onlineUsers');
const groupSelect = document.getElementById('groupSelect');

let onlineRef;
let userColor;

titleBtn.addEventListener('click', ()=>{
  const newTitle = titleInput.value.trim();
  if(newTitle) titleEl.textContent = newTitle;
});

// πιο ανοιχτά χρώματα για dark theme
function getRandomColor() {
  const colors = ['#ff6b6b','#ffd93d','#6bc1ff','#ffb86c','#c792ea','#50fa7b','#f1fa8c','#8be9fd','#ff79c6','#bd93f9'];
  return colors[Math.floor(Math.random()*colors.length)];
}

nameInp.addEventListener('change', ()=>{
  const name = nameInp.value.trim()||'Guest';
  if(!onlineRef) {
    userColor = getRandomColor();
    onlineRef = ref(db, 'online/' + name);
    set(onlineRef, { color: userColor, online: true });
    onDisconnect(onlineRef).remove();
  }
});

sendForm.addEventListener('submit', e=>{
  e.preventDefault();
  const name = nameInp.value.trim()||'Guest';
  const text = textInp.value.trim();
  if(!text) return;

  const group = groupSelect.value;
  const msgsRef = ref(db, 'groups/' + group);
  push(msgsRef, { name, text });

  textInp.value='';
});

function loadGroupMessages(group){
  messagesEl.innerHTML = '';
  const msgsRef = ref(db, 'groups/' + group);
  onChildAdded(msgsRef, snap=>{
    const m = snap.val();
    const div = document.createElement('div');
    div.className='msg';
    onValue(ref(db, 'online/' + m.name), snapColor=>{
      const color = snapColor.exists() ? snapColor.val().color : '#fff';
      div.style.color = color;
    });
    div.textContent = `${m.name}: ${m.text}`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  });
}

loadGroupMessages(groupSelect.value);
groupSelect.addEventListener('change', ()=>{
  loadGroupMessages(groupSelect.value);
});

const onlineListRef = ref(db, 'online');
onValue(onlineListRef, snap=>{
  const users = snap.exists() ? Object.entries(snap.val()).map(([name, val])=>`${name}`) : [];
  onlineEl.textContent = 'Online: ' + users.join(', ');
});
</script>

</body>
</html>
